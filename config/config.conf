# noctoprevi - konfigurasi
# Lokasi: ~/.config/noctoprevi/config.conf
#
# Format: KEY=VALUE, satu per baris. '#' memulai komentar.
# Semua nilai boleh diapit tanda kutip.
# Setelah ubah, jalankan: noctoprevi stop && noctoprevi start

# ---------------------------------------------------------------------------
# MEDIA
# ---------------------------------------------------------------------------

# Direktori tempat file video screensaver disimpan.
VIDEO_DIR=~/.config/noctoprevi/videos

# Urutan pemilihan clip:
#   shuffle     - acak tiap sesi
#   sequential  - berurutan (playlist)
PLAYBACK_MODE=shuffle

# Ekstensi yang dipindai (pisahkan dengan koma, tanpa titik).
VIDEO_EXTENSIONS=mp4,mkv,webm,mov

# 1 = pindai subfolder juga (VIDEO_RECURSIVE=1 lebih lambat tapi Handy untuk
# koleksi yang sudah diorganisasi per kategori).
VIDEO_RECURSIVE=0

# 1 = cek tiap file dengan ffprobe sebelum diputar, lewati yang rusak.
# 0 = quicker, andalkan Retry_limit.
VALIDATE_MEDIA=1

# Berapa kali supervisor mencoba file lain sebelum menyerah (FR-02).
RETRY_LIMIT=3

# Batas "mpv dianggap gagal" dalam milidetik. Kalau mpv mati lebih cepat dari
# ini, dianggap file bermasalah, bukan playback yang selesai normal.
STARTUP_GRACE_MS=2500

# ---------------------------------------------------------------------------
# PLAYBACK ENGINE (FR-03)
# ---------------------------------------------------------------------------

# Akselerasi perangkat keras. Pilihan: auto | no | vaapi | nvdec | cuda |
# drm | vk | vulkan | auto-safe
# auto/biarkan kosong = mpv memilih yang terbaik.
# NVDEC/VAAPI butuh paket libva-utils / nv-codec-headers terpasang.
HWDEC=auto

# Audio:
#   none  - mute total (default, mencegah suara mengganggu saat away)
#   nilai lain diteruskan ke mpv sebagai --audio=<nilai>
AUDIO=none

# Loop file yang sedang diputar. inf = tanpa batas.
LOOP_FILE=inf

# Sembunyikan kursor selama jendela screensaver aktif.
# always | never | <detik-idle>
CURSOR_AUTOHIDE=always

# 1 = layar penuh, 0 = window.
FULLSCREEN=1

# 1 = pertahankan border (0 hampir selalu benar untuk screensaver).
BORDER=0

# OSD mpv. 0 = tidak ada indikator seek/sapaan.
OSD_LEVEL=0

# ---------------------------------------------------------------------------
# MULTI-MONITOR (Fase 2)
# ---------------------------------------------------------------------------

#   focused  - satu jendela di monitor aktif (paling andal)
#   all      - satu instance mpv per output monitor
MONITOR_MODE=focused

# Batas instance bila MONITOR_MODE=all.
MAX_INSTANCES=4

# ---------------------------------------------------------------------------
# ARGUMEN MPV TAMBAHAN
# ---------------------------------------------------------------------------

# Argumen inti yang replacement-kan default. Kosongkan dulu kalau tidak
# perlu, lalu tambahkan satu per satu.
MPV_ARGS=

# Ditambahkan setelah MPV_ARGS, tidak menimpa apa pun.
# Contoh: --vf=scale=1920:1080:flags=lanczos --fps-limit=30
EXTRA_MPV_ARGS=

# ---------------------------------------------------------------------------
# LOG
# ---------------------------------------------------------------------------

# debug | info | warn | error | off
LOG_LEVEL=info

# stderr | file | both | journal | auto | none
#   stderr  - default. Kalau daemon dijalankan sebagai systemd user service
#             (hypridle/swayidle begitu biasanya), stderr otomatis masuk
#             journalctl, jadi tetap kelihatan.
#   file    - tulis ke LOG_FILE
#   both    - file + stderr
#   journal - langsung ke systemd-cat
#   auto    - journal bila systemd terdeteksi, selain itu stderr
LOG_TARGET=stderr

# Hanya dipakai bila LOG_TARGET=file atau both.
LOG_FILE=~/.local/state/noctoprevi/noctoprevi.log

# ---------------------------------------------------------------------------
# PERILAKU
# ---------------------------------------------------------------------------

# Berapa lama menunggu jawaban IPC {"command":["quit"]} sebelum escalating ke
# SIGTERM, dalam ms.
#
# Kenapa ada dua tahap: mpv menutup IPC quit dengan rapi tapi butuh ~40ms,
# sedangkan SIGTERM menutup jendela dalam ~10ms. Karena layar harus responsif
# dalam <150ms, program mencoba cara bersih dulu, lalu naik ke SIGTERM
# supaya tidak menunggu. Naikkan hanya kalau log debug menunjukkan
# eskalasi sering terjadi dan kamu lebih suka shut down sepenuhnya.
STOP_IPC_WAIT_MS=20

# Nilai yang ditulis ke hypridle.conf / swayidle config saat `install`.
#   IDLE_START_SEC = kapan screensaver menyala
#   IDLE_LOCK_SEC  = kapan lockscreen Noctalia dikunci
IDLE_START_SEC=300
IDLE_LOCK_SEC=900

# ---------------------------------------------------------------------------
# AERIALS
# ---------------------------------------------------------------------------

# 1080p | 1080p-hevc | 1080p-hdr | 4k | 4k-hdr
# 1080p H.264 paling kompatibel, 4K HEVC paling bagus tapi berat.
AERIALS_QUALITY=1080p

# Kosongkan untuk memakai VIDEO_DIR.
AERIALS_DIR=

# Argumen tambahan untuk curl saat mengunduh aerials. Berguna untuk proxy
# perusahaan atau trust store sendiri:
#   AERIALS_CURL_ARGS=--proxy http://proxy:8080
#   AERIALS_CURL_ARGS=--cacert /path/ke/bundle.pem
# Jangan pakai --insecure kecuali kamu benar-benar paham risikonya.
AERIALS_CURL_ARGS=
