# noctoprevi - konfigurasi
# Lokasi: ~/.config/noctoprevi/config.conf
#
# Format: KEY=VALUE, satu per baris. '#' memulai komentar.
# Semua nilai boleh diapit tanda kutip.
# Setelah ubah, jalankan: noctoprevi stop && noctoprevi start

# ---------------------------------------------------------------------------
# MEDIA
# ---------------------------------------------------------------------------

# Direktori tempat file video screensaver disimpan.
VIDEO_DIR=~/.config/noctoprevi/videos

# Urutan pemilihan clip:
#   shuffle     - acak tiap sesi
#   sequential  - berurutan (playlist)
PLAYBACK_MODE=shuffle

# Ekstensi yang dipindai (pisahkan dengan koma, tanpa titik).
VIDEO_EXTENSIONS=mp4,mkv,webm,mov

# 1 = pindai subfolder juga (VIDEO_RECURSIVE=1 lebih lambat tapi Handy untuk
# koleksi yang sudah diorganisasi per kategori).
VIDEO_RECURSIVE=0

# Tingkat pemeriksaan media sebelum diputar:
#   0 = percaya semua, jangan sentuh file. Paling cepat, tapi file rusak
#       baru ketahuan saat mpv gagal (Retry_limit yang rescuing).
#   1 = ada stream video dan durasi di atas MIN_DURATION_SEC. Default.
#   2 = tingkat 1 plus decode nyata 0.5 detik pakai ffmpeg. Menangkap file
#       yang header-nya utuh tapi terpotong di tengah - yang lolos ffprobe
#       tapi gagal dimPV. Tambah ~150ms per file, hanya jalan saat start.
VALIDATE_MEDIA=1

# Ambang durasi minimum (detik) untuk VALIDATE_MEDIA>=1. Potongan 0.3 detik
# biasanya hasil unduhan yang terputus.
MIN_DURATION_SEC=1

# Berapa kali supervisor mencoba file lain sebelum menyerah (FR-02).
RETRY_LIMIT=3

# Batas "mpv dianggap gagal" dalam milidetik. Kalau mpv mati lebih cepat dari
# ini, dianggap file bermasalah, bukan playback yang selesai normal.
STARTUP_GRACE_MS=2500

# ---------------------------------------------------------------------------
# PLAYBACK ENGINE (FR-03)
# ---------------------------------------------------------------------------

# Akselerasi perangkat keras. Pilihan: auto | no | vaapi | nvdec | cuda |
# drm | vk | vulkan | auto-safe
# auto/biarkan kosong = mpv memilih yang terbaik.
# NVDEC/VAAPI butuh paket libva-utils / nv-codec-headers terpasang.
HWDEC=auto

# Audio:
#   none  - mute total (default, mencegah suara mengganggu saat away)
#   nilai lain diteruskan ke mpv sebagai --audio=<nilai>
AUDIO=none

# Loop file yang sedang diputar. inf = tanpa batas.
LOOP_FILE=inf

# Sembunyikan kursor selama jendela screensaver aktif.
# always | never | <detik-idle>
CURSOR_AUTOHIDE=always

# 1 = layar penuh, 0 = window.
FULLSCREEN=1

# 1 = pertahankan border (0 hampir selalu benar untuk screensaver).
BORDER=0

# OSD mpv. 0 = tidak ada indikator seek/sapaan.
OSD_LEVEL=0

# Label OSD per-instance: berkas teks, satu baris per instance, baris ke-N
# dipakai instance ke-N. Hanya dipakai kalau OSD_LEVEL > 0.
# Semua instance memutar berkas yang sama, jadi ini satu-satunya cara
# membedakan monitor mana yang sedang diuji. Dipakai `selftest`.
# OSD_MSG_FILE=/path/ke/labels.txt

# Batas fps saat playback. 0 = mati, semua frame diproses.
# Nilai yang diterima: 0, 15, 24, 25, 30, 50, 60
#
# CATATAN PENTING: ini bukan penghematan decode. VA-API tetap men-decode
# semua frame; yang berkurang hanya beban presentasi. Penghematan baterai
# yang nyata datang dari clip 30fps, bukan option ini. Lihat README.
VIDEO_FPS_LIMIT=0

# ---------------------------------------------------------------------------
# MULTI-MONITOR (Fase 2)
# ---------------------------------------------------------------------------

#   focused  - satu jendela di monitor aktif (paling andal)
#   all      - satu instance mpv per output monitor
MONITOR_MODE=focused

# Batas instance bila MONITOR_MODE=all.
MAX_INSTANCES=4

# ---------------------------------------------------------------------------
# ARGUMEN MPV TAMBAHAN
# ---------------------------------------------------------------------------

# Argumen inti yang replacement-kan default. Kosongkan dulu kalau tidak
# perlu, lalu tambahkan satu per satu.
MPV_ARGS=

# Ditambahkan setelah MPV_ARGS, tidak menimpa apa pun.
# Contoh: --vf=scale=1920:1080:flags=lanczos --fps-limit=30
EXTRA_MPV_ARGS=

# ---------------------------------------------------------------------------
# LOG
# ---------------------------------------------------------------------------

# debug | info | warn | error | off
LOG_LEVEL=info

# stderr | file | both | journal | auto | daemon | none
#   daemon  - default. Kalau stdout/stderr berupa TTY (kamu jalankan manual
#             di terminal) -> stderr. Kalau dipanggil idle daemon -> journal
#             bila systemd tersedia, selain itu tulis ke LOG_FILE.
#             Dipilih sebagai default supaya supervisor yang hidup berjam-jam
#             tidak menahan pipe milik idle daemon dan membuatnya menggantung.
#   stderr  - selalu ke stderr
#   file    - tulis ke LOG_FILE
#   both    - file + stderr
#   journal - langsung ke systemd-cat
#   auto    - journal bila systemd terdeteksi, selain itu stderr
LOG_TARGET=daemon

# Hanya dipakai bila LOG_TARGET=file, both, atau daemon tanpa systemd.
LOG_FILE=~/.local/state/noctoprevi/noctoprevi.log

# Log berputar sendiri kalau lewat LOG_MAX_LINES baris. Satu generasi:
# file yang lama dipindah jadi noctoprevi.log.1 lalu ditimpa.
# 0 = tidak pernah berputar. Rotasi dicek sekali per `start`, bukan per baris.
LOG_MAX_LINES=2000

# ---------------------------------------------------------------------------
# ANOMALI
# ---------------------------------------------------------------------------

# Anomali adalah kejadian tidak biasa: media ditolak, stop butuh eskalasi,
# hwdec jatuh ke software, dan sebagainya. Dicatat sebagai NDJSON di
# ~/.local/state/noctoprevi/anomalies.ndjson, satu objek per baris, dengan
# kode stabil dan hint tentang apa yang harus dicoba.
#
# Bedanya dengan log biasa: log dibaca berurutan dan hanya berisi yang enak
# dibaca; anomali bisa DIHITUNG. `noctoprevi anomalies --counts` memberi
# tahu berapa kali stop butuh eskalasi dalam 24 jam terakhir, yang tidak
# bisa dijawab dari teks bebas.
#
# Lihat daftar kode: noctoprevi anomalies --codes
ANOMALY_ENABLED=1

# Berapa baris anomali yang disimpan sebelum dipangkas.
ANOMALY_MAX_LINES=2000

# Kirim notifikasi desktop saat ada anomali severity error/security.
# Default 0 (mati) supaya tidak mengganggu. Kalau menyala, satu notifikasi
# per jendela waktu berikut supaya error yang berulang tidak membanjiri.
ANOMALY_NOTIFY=0
ANOMALY_NOTIFY_INTERVAL=3600

# Ambang peringatan. Melewati angka ini dicatat sebagai anomali, bukan
# hanya dihitung di log.
START_WARN_MS=1500
STOP_WARN_MS=150

# ---------------------------------------------------------------------------
# PERILAKU
# ---------------------------------------------------------------------------

# Berapa lama menunggu jawaban IPC {"command":["quit"]} sebelum escalating ke
# SIGTERM, dalam ms.
#
# Kenapa ada dua tahap: mpv menutup IPC quit dengan rapi tapi butuh ~40ms,
# sedangkan SIGTERM menutup jendela dalam ~10ms. Karena layar harus responsif
# dalam <150ms, program mencoba cara bersih dulu, lalu naik ke SIGTERM
# supaya tidak menunggu. Naikkan hanya kalau log debug menunjukkan
# eskalasi sering terjadi dan kamu lebih suka shut down sepenuhnya.
STOP_IPC_WAIT_MS=20

# Animasi keluar. Saat screensaver dimatikan - termasuk waktu kamu menekan
# space atau enter untuk membangunkannya - gambar digeser keluar dulu sebelum
# jendela ditutup, supaya tidak feels seperti mati mendadak.
#
#   none (default) | slideleft | slideright | slideup | slidedown
#
# Kenapa default `none`: animasi menambah durasi sebelum layar benar-benar
# bersih. Anggaran latensi stop yang diukur di `bench` adalah p95 < 150ms,
# dan animasi 220ms mendorong totalnya ke ~390ms. Ini tukar rasa visual
# dengan angka latensi, bukan perbaikan gratis - jadi yang menentukan kamu.
#
# Catatan: yang bergeser adalah GAMBAR di dalam jendela, bukan jendela itu
# sendiri. Di Wayland mpv tidak bisa mengatur posisi jendelanya, jadi area
# yang terbuka selama animasi berisi warna latar mpv (hitam).
EXIT_ANIM=none
EXIT_ANIM_MS=220

# Nilai yang ditulis ke hypridle.conf / swayidle config saat `install`.
#   IDLE_START_SEC = kapan screensaver menyala
#   IDLE_LOCK_SEC  = kapan lockscreen Noctalia dikunci
#
# 600/1200 adalah titik tengah yang masuk akal: cukup lama untuk tidak
# menyela orang yang sedang membaca, cukup cepat untuk screensaver terasa
# berguna. Kalau kamu sering menyela, naikkan IDLE_START_SEC ke 900.
# Kalau mau lebih cepat, turunkan - tapi jangan di bawah 120 detik, atau
# layar akan berkedip saat kamu sedang membaca.
#
# Setelah diubah: hyprctl reload / swaymsg reload
IDLE_START_SEC=600
IDLE_LOCK_SEC=1200

# ---------------------------------------------------------------------------
# AERIALS
# ---------------------------------------------------------------------------

# 1080p | 1080p-hevc | 1080p-hdr | 4k | 4k-hdr
# 1080p H.264 paling kompatibel, 4K HEVC paling bagus tapi berat.
AERIALS_QUALITY=1080p

# Kosongkan untuk memakai VIDEO_DIR.
AERIALS_DIR=

# Cara program mempercayai sertifikat server Apple:
#   auto    - coba trust store sistem dulu; kalau gagal karena sertifikat,
#             ambil Apple Root CA dari apple.com dan verifikasi sidik jarinya
#   system  - hanya trust store sistem (tidak pernah mengambil root apa pun)
#   apple   - selalu ambil pakai root CA Apple lebih dulu
#
# auto paling aman dan paling ramah: Apple Root CA tidak ada di trust list
# Mozilla, jadi tanpa ini `aerials` gagal di hampir semua distro Linux.
# Root hanya dipakai untuk unduhan aerials, tidak mengubah trust store sistem.
AERIALS_TRUST=auto

# Argumen tambahan untuk curl saat mengunduh aerials. Berguna untuk proxy
# perusahaan atau trust store sendiri:
#   AERIALS_CURL_ARGS=--proxy http://proxy:8080
#   AERIALS_CURL_ARGS=--cacert /path/ke/bundle.pem
# Jangan pakai --insecure kecuali kamu benar-benar paham risikonya.
AERIALS_CURL_ARGS=
